[project]
name = "smart-scene-analyzer"
version = "0.1.0"
description = "On-device indoor scene perception: object detection and monocular depth. Python trains and exports; the app runs them on the handset."
readme = "README.md"
requires-python = ">=3.11"

# Nothing here serves HTTP. `src/` trains the models, exports the artifacts, and
# remains the reference implementation the device is checked against — so these are
# the array, image, and validation libraries that job needs, and nothing else.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
]

# Model, dataset, and MLOps dependencies are added in the lessons that introduce
# them, so students see each one arrive with a reason.
[project.optional-dependencies]
dataset = [
    "roboflow>=1.1",   # Lesson 02 — SDK + `roboflow import` CLI
    "h5py>=3.12",      # Lesson 02 — NYU Depth V2 ships as HDF5
    "scipy>=1.14",     # Lesson 02 — SUN RGB-D ships MATLAB .mat metadata
]
ml = [
    "ultralytics>=8.3",  # Lesson 03 — YOLO11
    "torch>=2.5",        # Lesson 03
    "mlflow>=2.17",      # Lesson 03
]
depth = [
    "transformers>=4.46",  # Lesson 03 — Depth Anything V2, inference only
    "timm>=1.0",           # Lesson 03 — backbone Depth Anything V2 depends on
]
export = [
    # Lesson 04 — YOLO11 -> int8 TFLite. As of ultralytics 8.4.118, format='tflite' and
    # int8=True are DEPRECATED in favor of format='litert' (Google's TFLite rebrand) and
    # quantize=8, which routes through `litert_torch` directly rather than the older
    # onnx2tf-based path — found by actually running the export, not from documentation.
    "litert-torch>=0.9.0",
    "ai-edge-litert>=2.1.4",
    "tensorflow>=2.16",
    "onnx>=1.16",
    "onnx2tf>=1.26",
    "onnxslim>=0.1.31",
    "onnxruntime>=1.19",
    "sng4onnx>=1.0.1",
    # Lesson 04 — Depth Anything V2 -> ExecuTorch. `optimum[executorch]` is NOT a
    # real extra as of optimum 2.3.0 (uv warns and silently skips it) — the actual
    # package is the standalone `optimum-executorch`, which pulls in `executorch`
    # itself and downgrades `optimum` (2.3.0 -> 2.0.0) and `transformers` (5.15.0
    # -> 5.0.0rc1, a release candidate). Verified the real depth inference path
    # (not just the mocked offline suite) still runs correctly under the
    # downgrade before pinning this. Neither export toolchain is otherwise
    # verified against this project's models; a failure here is the finding this
    # lesson step asks for, not a bug to silently route around.
    "optimum-executorch>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_scene_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "roboflow.*",
    "ultralytics.*",
    "transformers.*",
    "timm.*",
    "scipy.*",
    "yaml.*",
    "ai_edge_litert.*",
    "tensorflow.*",
    "executorch.*",
    "optimum.*",
    "torchao.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The default suite runs with no GPU, no network, and no weights on disk — see
# .claude/skills/offline-suite. Anything that needs a checkpoint or an exported
# artifact is marked, so it can be deselected with `-m "not integration"`.
markers = [
    "integration: requires model weights or exported artifacts on disk",
]
